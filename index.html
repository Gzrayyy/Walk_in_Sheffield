        let results = { 
            user: {

            }, 
            votes: [], votes_p3: [],
            startedAt: new Date().toISOString()
        };

        let surveyPool = [];   
        let surveyPoolP3 = []; 
        const MAX_P2_ROUNDS = 15; 
        const MAX_P3_ROUNDS = 20; 
        const LOCS_PER_ROUND = 4; 
        const CONTEXTS = ['twilight', 'rainy', 'snowy', 'sunny'];
        let activeImageIndices = [0, 0, 0, 0];

        const app = document.getElementById('app');

        // --- 2. 初始化与随机算法 ---
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function initSurvey() {
            if (surveyPool.length > 0) return; 
            if (typeof streetViews === 'undefined') return;

            // --- Part 2 初始化 ---
            let allLocsP2 = [...streetViews];
            shuffle(allLocsP2);
            surveyPool = allLocsP2.slice(0, MAX_P2_ROUNDS * LOCS_PER_ROUND);
            
            // --- Part 3 初始化 ---
            if (typeof streetViewsP3 === 'undefined') return;
            let p3Locs = [...streetViewsP3]; 
            shuffle(p3Locs); 

            surveyPoolP3 = [];

            // Stage 1: 前5轮，同一地点对比4种天气
            let stage1Locs = p3Locs.slice(0, 5);
            stage1Locs.forEach(loc => {
                let round = CONTEXTS.map(ctx => ({
                    id: loc.id,
                    context: ctx,
                    images: loc.images.filter(img => img.toLowerCase().includes(ctx)).slice(0, 4)
                }));
                surveyPoolP3.push(round);
            });

            // Stage 2: 后15轮，从全部90个地点随机抽取
            let comboPool = [];
            [...p3Locs].forEach(loc => {  // 全部90个地点进候选池
                CONTEXTS.forEach(ctx => {
                    comboPool.push({
                        id: loc.id,
                        context: ctx,
                        images: loc.images.filter(img => img.toLowerCase().includes(ctx)).slice(0, 4)
                    });
                });
            });

            shuffle(comboPool); 
            
            // 15轮 * 4个 = 60个组合
            let stage2Combos = comboPool.slice(0, 60);

            for(let i = 0; i < 15; i++) {
                let round = stage2Combos.slice(i * 4, (i + 1) * 4);
                surveyPoolP3.push(round);
            }
        }

        // --- 3. 渲染控制器 ---

            } else if (currentIdx === -1) {
                renderCombinedInfo();
            } else if (currentIdx < surveyPool.length) {
                renderVote(); 
            } else if (currentIdx === 999) {
                renderPart3Bridge(); 
            } else if (currentIdx >= 1000 && (currentIdx - 1000) < MAX_P3_ROUNDS) {
                renderVoteP3(); 
            } else if (currentIdx === 2000) {
                renderOpenQuestion();
            } else {
                renderEnd();
            }

        }

        function checkProlificMatch() {
            const id1 = document.getElementById('prolific-id-1').value.trim();
            const id2 = document.getElementById('prolific-id-2').value.trim();
            const btn = document.getElementById('prolific-next-btn');

                currentIdx = 2000; // 跳转到开放性问题页
            } else {
                currentIdx++;
            }
            updateUI();
            window.scrollTo(0, 0);
        }

        function goBack() { 
            if (currentIdx === 0) {
                currentIdx = -3; 
            } else {
                if (currentIdx === 999) {
                    currentIdx = (MAX_P2_ROUNDS - 1) * LOCS_PER_ROUND;
                } else {
                    currentIdx -= LOCS_PER_ROUND;
                }
                // 恢复上一轮的选择数据
                const lastVote = results.votes.pop(); 
                if (lastVote) {
                    currentRoundSelection = { best: lastVote.best, worst: lastVote.worst };
                }
            }
            updateUI(); 
            window.scrollTo(0, 0);
        }

        // P3 的返回逻辑同理
        function goBackP3() {
            if (currentIdx === 1000) currentIdx = 999; else { 
                currentIdx--; 
                const lastVote = results.votes_p3.pop(); 
                if (lastVote) {
                    currentRoundSelection = { best: lastVote.best, worst: lastVote.worst };
                }
            }
            updateUI();
            window.scrollTo(0, 0);
        }

        function resetRound() { 
            currentRoundSelection = { best: null, worst: null }; 
            activeImageIndices = [0, 0, 0, 0]; 
            // 判断当前在哪个阶段
            if (currentIdx >= 1000) {
                renderVoteP3();
            } else {
                renderVote(); 
            }
        }
        function startVoting() { 
            console.log("进入调研...", currentIdx);
            if (surveyPool.length === 0) { 
                initSurvey(); 
            }
            currentIdx = -3;
            updateUI(); 
            window.scrollTo(0,0); 
        }

        async function renderEnd() {
            // 1. 立即渲染页面，移除“下载文件”的提示文字
            app.innerHTML = `
                <div class="text-center py-24 space-y-16">
                    <div id="upload-status" class="text-4xl font-bold text-blue-600 animate-pulse">
                        📤 Sending your results to the cloud...
                    </div>
                    <div class="text-[200px] animate-bounce">🏙️</div>
                    <h2 class="text-9xl font-black text-green-600 uppercase tracking-tighter">Finished!</h2>
                    <p class="text-5xl text-slate-500 px-12 leading-tight font-medium">
                        Thank you! Your choices help improve walkability in Sheffield.
                    </p>
                    <button onclick="location.reload()" class="text-3xl text-slate-400 underline pt-10 block mx-auto">
                        Restart Survey
                    </button>
                </div>
            `;

            // 2. 准备并上传到 Supabase
            try {
                const { error } = await _supabase
                    .from('survey_responses') // 对应你的表名
                    .insert([{ payload: results }]); // 将整个 results 存入 payload

                const statusEl = document.getElementById('upload-status');
                if (error) throw error;

                // 3. 上传成功后，更新状态文字，不再弹出下载框
                statusEl.innerHTML = "✅ Results saved! Redirecting back to Prolific...";
                statusEl.classList.remove('animate-pulse', 'text-blue-600');
                statusEl.classList.add('text-green-600');

                // 取消离开页面警告，避免跳转时弹出确认框
                window.onbeforeunload = null;

                setTimeout(() => {
                    window.location.href = "https://app.prolific.com/submissions/complete?cc=C109KCC7";  //replace with your actual Prolific completion URL
                }, 2000);
                
            } catch (err) {
                console.error('Upload Error:', err);
                const statusEl = document.getElementById('upload-status');
                statusEl.innerHTML = "❌ Upload failed. Please contact the researcher.";
                statusEl.classList.remove('animate-pulse', 'text-blue-600');
                statusEl.classList.add('text-red-600');
                // 即便失败也跳转，让参与者拿到报酬
                window.onbeforeunload = null;
                setTimeout(() => {
                    window.location.href = "https://app.prolific.com/submissions/complete?cc=C109KCC7";
                }, 3000);
            }
        }

        function updateProgress() {
            const totalSteps = 1 + MAX_P2_ROUNDS + 1 + MAX_P3_ROUNDS + 1;
            let currentStep;
            
            if (currentIdx === -2) currentStep = 0;
            else if (currentIdx === -15) currentStep = 0;
            else if (currentIdx === -3 || currentIdx === -1) currentStep = 1;
            else if (currentIdx < 999) currentStep = Math.floor(currentIdx / 4) + 2;
            else if (currentIdx === 999) currentStep = 1 + MAX_P2_ROUNDS + 1;
            else if (currentIdx >= 1000 && currentIdx < 2000) currentStep = (currentIdx - 1000) + 1 + MAX_P2_ROUNDS + 1 + 1;
            else currentStep = totalSteps;

            const display = currentStep > totalSteps ? totalSteps : currentStep;
            document.getElementById('progress-step').innerText = `${display} / ${totalSteps}`;
        }
        
        currentIdx = -2;
        initSurvey();
        updateUI();
    </script>
</body>
</html>
